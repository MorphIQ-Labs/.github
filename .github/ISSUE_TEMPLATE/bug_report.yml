name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps or example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected release, branch, or commit.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, toolchain, and configuration details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and other sensitive data before pasting logs.
      render: shell

